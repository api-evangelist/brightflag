apis:
- name: Brightflag API
  description: >-
    OAuth 2.0 secured REST API (OpenAPI 3.1) for Brightflag's enterprise legal
    management platform. Includes a Reporting API to extract key datasets and a
    Matter Budget API, plus operations to search invoices, download invoice
    documents, post invoice payment status, and look up matters and vendors.
    Base URLs are region-specific and provided in the developer portal.
