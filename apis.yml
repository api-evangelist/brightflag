aid: brightflag
name: Brightflag
description: >-
  Brightflag is an AI-first enterprise legal management (ELM) platform that helps
  corporate legal teams control legal spend, manage matters, benchmark outside
  counsel, and automate invoice review. Founded in 2014 and headquartered in
  Dublin with a New York presence, Brightflag combines patented AI for invoice
  review and spend classification with e-billing, matter management, vendor
  management, and reporting. For developers Brightflag exposes an OAuth 2.0
  secured REST API (OpenAPI 3.1) — including a Reporting API for extracting key
  datasets and a Matter Budget API — to integrate legal operations data with ERP,
  payment, and enterprise systems. This profile was enriched from Brightflag's
  public developer documentation and help center.
